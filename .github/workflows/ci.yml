name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter=@vorzop/shared --filter=@vorzop/db --filter=@vorzop/domain --filter=@vorzop/ui --filter=@vorzop/api --filter=@vorzop/web

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Wiring audit
        run: pnpm wiring-audit

      - name: Secrets grep (no keys in repo)
        run: |
          ! rg -i 'sk_live|sk_test|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|BEGIN (RSA |OPENSSH )?PRIVATE KEY' \
            --glob '!.github/workflows/ci.yml' \
            --glob '!docs/**' \
            --glob '!*.md' \
            . || (echo "Possible secret detected in repo" && exit 1)

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vorzop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vorzop
      AUTH_SECRET: ci-auth-secret-minimum-32-characters-long
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      API_JWT_SECRET: ci-jwt-secret-minimum-16-chars
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://localhost:4000
      NODE_ENV: test
      SEED_DEMO_DATA: "true"
      E2E_DEMO_EMAIL: admin@vortexoptimizer.com
      E2E_DEMO_PASSWORD: demo-password
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm turbo build

      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: e2e

      - name: Start API and web
        run: |
          pnpm --filter @vorzop/api start > /tmp/vorzop-api.log 2>&1 &
          echo $! > /tmp/vorzop-api.pid
          pnpm --filter @vorzop/web start > /tmp/vorzop-web.log 2>&1 &
          echo $! > /tmp/vorzop-web.pid

      - name: Wait for services
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4000/health >/dev/null && curl -sf http://localhost:3000/welcome >/dev/null; then
              echo "Services ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "API log:" && tail -50 /tmp/vorzop-api.log || true
          echo "Web log:" && tail -50 /tmp/vorzop-web.log || true
          exit 1

      - name: E2E smoke
        run: pnpm e2e:smoke

      - name: Stop services
        if: always()
        run: |
          kill "$(cat /tmp/vorzop-api.pid)" 2>/dev/null || true
          kill "$(cat /tmp/vorzop-web.pid)" 2>/dev/null || true
